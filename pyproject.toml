[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "contextcache"
version = "0.2.0"
description = "Persistent KV cache for LLM tool schemas — compile tool definitions once, reuse the cache across users and sessions, keep TTFT near 200ms at 50 tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Pranab Sarkar", email = "developer@pranab.co.in"},
]
keywords = [
    "llm", "kv-cache", "prompt-caching", "inference-optimization",
    "tool-calling", "function-calling", "ai-agents", "transformers",
    "ttft", "llm-inference", "caching",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
server = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "accelerate>=0.25.0",
    "httpx>=0.25.0",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/spranab/contextcache"
Repository = "https://github.com/spranab/contextcache"
"Bug Tracker" = "https://github.com/spranab/contextcache/issues"
Paper = "https://doi.org/10.5281/zenodo.18795189"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["context_cache*"]
